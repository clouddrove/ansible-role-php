---

- name: Download composer
  ansible.builtin.get_url:
    url: http://getcomposer.org/installer
    force: true
    dest: /tmp/composer
    mode: 0755

# yamllint disable
- name: Install composer
  ansible.builtin.command:
    cmd: php /tmp/composer --install-dir=/usr/local/bin creates=/usr/local/bin/composer

- name: Rename composer.phar to composer
  ansible.builtin.command:
    cmd: mv /usr/local/bin/composer.phar /usr/local/bin/composer creates=/usr/local/bin/composer
# yamllint enable

- name: Make composer executable
  ansible.builtin.file:
    path: /usr/local/bin/composer
    mode: a+x
    state: file
